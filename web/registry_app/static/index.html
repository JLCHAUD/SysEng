<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>ExoSync Studio N2 — Registry Populator</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #273348;
      --surface-alt: #162032;
      --border: #334155;
      --accent: #10b981;
      --accent-hover: #059669;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --sidebar-w: 224px;
    }

    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; }
    #app  { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-logo {
      padding: 20px 16px 16px; border-bottom: 1px solid var(--border);
      font-size: 1.05rem; font-weight: 700; color: var(--accent); letter-spacing: 0.04em;
    }
    .sidebar-logo span { color: var(--text-dim); font-weight: 400; font-size: 0.72rem; display: block; margin-top: 3px; }
    nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .nav-group { padding: 4px 12px; margin-bottom: 2px; }
    .nav-group-label {
      font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim); padding: 8px 4px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 7px 10px;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem;
      color: var(--text-dim); transition: all 0.15s;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent); color: #fff; }
    .nav-icon { width: 16px; text-align: center; flex-shrink: 0; }
    .sidebar-status {
      padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.73rem; color: var(--text-dim);
    }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status-dot.ok { background: var(--ok); }
    .status-dot.err { background: var(--err); }

    /* Main */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 52px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 16px; flex-shrink: 0;
    }
    .topbar-title { font-size: 0.95rem; font-weight: 600; }
    .topbar-badge {
      background: var(--surface2); color: var(--text-dim); font-size: 0.68rem;
      padding: 2px 8px; border-radius: 12px;
    }
    .topbar-spacer { flex: 1; }
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* Cards & tables */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; margin-bottom: 16px;
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-title { font-size: 0.88rem; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th {
      text-align: left; padding: 9px 12px; color: var(--text-dim); font-weight: 500;
      border-bottom: 1px solid var(--border); font-size: 0.73rem;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* Badges */
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 0.69rem; font-weight: 500;
    }
    .badge-blue   { background: #1e3a5f; color: #60a5fa; }
    .badge-green  { background: #14532d; color: #4ade80; }
    .badge-teal   { background: #134e4a; color: #2dd4bf; }
    .badge-orange { background: #431407; color: #fb923c; }
    .badge-purple { background: #3b0764; color: #c084fc; }
    .badge-gray   { background: var(--surface2); color: var(--text-dim); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: 6px; border: none; cursor: pointer; font-size: 0.82rem;
      font-weight: 500; transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }
    .btn-danger { background: transparent; color: var(--err); border: 1px solid var(--err); }
    .btn-danger:hover:not(:disabled) { background: #7f1d1d33; }
    .btn-sm { padding: 4px 10px; font-size: 0.73rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      width: 560px; max-width: 96vw; max-height: 92vh; overflow-y: auto;
      padding: 24px;
    }
    .modal-title { font-size: 0.97rem; font-weight: 600; margin-bottom: 20px; }

    /* Forms */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 7px 10px; font-size: 0.84rem; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .stat-value { font-size: 1.7rem; font-weight: 700; }
    .stat-label { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }

    /* Graph */
    #cy { width: 100%; height: calc(100vh - 140px); background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }

    /* Tissage drag & drop */
    .weave-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; height: 100%;
    }
    .weave-post-block {
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden;
    }
    .weave-post-header {
      background: var(--surface2); padding: 8px 12px; font-size: 0.82rem; font-weight: 600;
    }
    .weave-table-item {
      padding: 6px 12px 6px 20px; font-size: 0.8rem; cursor: grab;
      color: var(--text-dim); border-top: 1px solid var(--border);
      transition: background 0.1s;
    }
    .weave-table-item:hover { background: var(--surface2); color: var(--accent); }
    .weave-table-item.dragging { opacity: 0.4; }
    .drop-zone {
      border: 2px dashed var(--border); border-radius: 8px; padding: 32px;
      text-align: center; color: var(--text-dim); font-size: 0.85rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.over { border-color: var(--accent); background: rgba(16,185,129,0.06); }

    /* Empty / loading */
    .empty { text-align: center; padding: 60px; color: var(--text-dim); }
    .loading { text-align: center; padding: 40px; color: var(--text-dim); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Toast transition */
    .toast-enter-active, .toast-leave-active { transition: all 0.3s; }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateX(30px); }
  </style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
