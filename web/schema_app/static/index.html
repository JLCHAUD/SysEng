<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>ExoSync Studio N1 — Schema Designer</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #273348;
      --border: #334155;
      --accent: #6366f1;       /* indigo — distingue N1 de N2 (bleu) */
      --accent2: #818cf8;
      --accent-hover: #4f46e5;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
      --prescribed: #ef4444;
      --typical: #64748b;
      --sidebar-w: 230px;
    }

    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; }
    #app  { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-logo {
      padding: 18px 16px 14px; border-bottom: 1px solid var(--border);
    }
    .sidebar-logo-title { font-size: 1rem; font-weight: 700; color: var(--accent2); letter-spacing: 0.04em; }
    .sidebar-logo-sub { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
    .sidebar-eco {
      padding: 10px 16px; background: var(--surface2); border-bottom: 1px solid var(--border);
      font-size: 0.72rem; color: var(--text-dim); cursor: pointer;
    }
    .sidebar-eco:hover { color: var(--text); }
    .sidebar-eco-name { color: var(--accent2); font-weight: 600; font-size: 0.78rem; }

    nav { flex: 1; padding: 10px 0; overflow-y: auto; }
    .nav-group { margin-bottom: 4px; }
    .nav-group-label {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text-dim); padding: 10px 16px 4px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 16px;
      cursor: pointer; font-size: 0.85rem; color: var(--text-dim); transition: all 0.15s;
      border-left: 2px solid transparent;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(99,102,241,0.15); color: var(--accent2); border-left-color: var(--accent); }
    .nav-icon { font-size: 0.95rem; width: 18px; text-align: center; }
    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--text-dim);
    }

    /* Main */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: 54px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 12px; flex-shrink: 0;
    }
    .topbar-title { font-size: 0.95rem; font-weight: 600; }
    .topbar-badge {
      background: var(--surface2); color: var(--text-dim); font-size: 0.68rem;
      padding: 2px 8px; border-radius: 12px;
    }
    .topbar-spacer { flex: 1; }
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    /* Cards & tables */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; margin-bottom: 16px;
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-title { font-size: 0.9rem; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 9px 12px; color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 0.68rem; font-weight: 500;
    }
    .badge-prescribed { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
    .badge-typical    { background: #1e293b; color: #94a3b8; border: 1px solid #475569; }
    .badge-interne    { background: #1e3a5f; color: #60a5fa; }
    .badge-externe    { background: #431407; color: #fb923c; }
    .badge-indigo     { background: #1e1b4b; color: #a5b4fc; }
    .badge-gray       { background: var(--surface2); color: var(--text-dim); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: 6px; border: none; cursor: pointer; font-size: 0.82rem;
      font-weight: 500; transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .btn-danger { background: transparent; color: var(--err); border: 1px solid #7f1d1d; }
    .btn-danger:hover { background: #7f1d1d33; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; }
    .btn-xs { padding: 2px 7px; font-size: 0.7rem; }
    .btn-ok { background: transparent; color: var(--ok); border: 1px solid #14532d; }
    .btn-ok:hover { background: #14532d33; }

    /* Forms / Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200;
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      width: 640px; max-width: 96vw; max-height: 90vh; overflow-y: auto; padding: 24px;
    }
    .modal-lg { width: 820px; }
    .modal-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 5px; }
    input, select, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 7px 10px; font-size: 0.83rem; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; font-family: 'Courier New', monospace; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* Tags input */
    .tags-input {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 6px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px; min-height: 36px;
    }
    .tag { background: var(--surface2); padding: 2px 8px; border-radius: 12px; font-size: 0.72rem; display: flex; align-items: center; gap: 4px; }
    .tag-remove { cursor: pointer; color: var(--text-dim); line-height: 1; }
    .tags-input input { border: none; background: none; flex: 1; min-width: 120px; padding: 2px 4px; }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab-btn {
      padding: 9px 16px; font-size: 0.82rem; cursor: pointer; color: var(--text-dim);
      border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }

    /* Wizard steps */
    .wizard-steps { display: flex; gap: 0; margin-bottom: 28px; }
    .wizard-step {
      flex: 1; text-align: center; padding: 10px 4px; font-size: 0.75rem;
      color: var(--text-dim); border-bottom: 2px solid var(--border); position: relative;
    }
    .wizard-step.active { color: var(--accent2); border-bottom-color: var(--accent); font-weight: 600; }
    .wizard-step.done { color: var(--ok); border-bottom-color: var(--ok); }
    .step-num {
      display: inline-block; width: 22px; height: 22px; border-radius: 50%;
      background: var(--surface2); color: var(--text-dim); font-size: 0.72rem;
      line-height: 22px; text-align: center; margin-bottom: 4px;
    }
    .wizard-step.active .step-num { background: var(--accent); color: #fff; }
    .wizard-step.done .step-num { background: var(--ok); color: #fff; }

    /* Master-detail */
    .master-detail { display: flex; gap: 0; height: 100%; min-height: 0; }
    .master-list {
      width: 240px; flex-shrink: 0; border-right: 1px solid var(--border);
      overflow-y: auto; padding: 8px 0;
    }
    .master-item {
      padding: 10px 14px; cursor: pointer; font-size: 0.83rem;
      border-left: 2px solid transparent; transition: all 0.12s;
    }
    .master-item:hover { background: var(--surface2); }
    .master-item.selected { background: rgba(99,102,241,0.12); border-left-color: var(--accent); color: var(--accent2); }
    .master-item-label { font-weight: 500; }
    .master-item-sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
    .detail-panel { flex: 1; overflow-y: auto; padding: 20px 24px; }

    /* Graph */
    #cy-blueprint { width: 100%; height: calc(100vh - 140px); background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }

    /* MXL preview */
    .mxl-preview {
      font-family: 'Courier New', monospace; font-size: 0.82rem; line-height: 1.6;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; white-space: pre; overflow-x: auto; color: #e2e8f0;
    }
    .mxl-keyword { color: #818cf8; font-weight: 600; }
    .mxl-value   { color: #34d399; }
    .mxl-comment { color: #475569; font-style: italic; }
    .mxl-string  { color: #fbbf24; }

    /* Ecosystem cards */
    .eco-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
    .eco-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 18px; cursor: pointer; transition: all 0.15s;
    }
    .eco-card:hover { border-color: var(--accent); }
    .eco-card.active { border-color: var(--accent); background: rgba(99,102,241,0.08); }
    .eco-card-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
    .eco-card-path { font-size: 0.72rem; color: var(--text-dim); font-family: monospace; margin-bottom: 10px; word-break: break-all; }
    .eco-card-meta { display: flex; gap: 10px; font-size: 0.75rem; color: var(--text-dim); }

    /* Loading / empty */
    .loading { text-align: center; padding: 40px; color: var(--text-dim); }
    .empty { text-align: center; padding: 60px; color: var(--text-dim); }

    /* Inline toggle */
    .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.83rem; }
    .toggle input[type=checkbox] { width: auto; cursor: pointer; accent-color: var(--accent); }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border); border-radius: 10px; padding: 40px;
      text-align: center; color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); color: var(--text); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Toast */
    .toast-enter-active, .toast-leave-active { transition: all 0.25s; }
    .toast-enter-from, .toast-leave-to { opacity: 0; transform: translateX(30px); }
  </style>
</head>
<body>
<div id="app"></div>
<script src="/schema_views.js"></script>
<script src="/app.js"></script>
</body>
</html>
